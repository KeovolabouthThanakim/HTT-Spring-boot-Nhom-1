spring.application.name=HTT-SPB
spring.datasource.url=jdbc:mariadb://localhost:3306/lms_db?allowPublicKeyRetrieval=true&sslMode=disable
spring.datasource.username=root
spring.datasource.password=23att149

# validate = Kiểm tra Entity khớp với DB (không tạo hoặc sửa bảng)
spring.jpa.hibernate.ddl-auto=update


server.servlet.context-path=/

# JSP configuration
spring.mvc.view.prefix=/WEB-INF/templates/
spring.mvc.view.suffix=.jsp

# Encoding UTF-8
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.force-response=true

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.strategy.content.enabled=false

spring.web.error.include-message=never
spring.web.error.include-binding-errors=always

spring.thymeleaf.cache=false
# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# BUG FIX: กำหนด upload base dir ให้ตรงกันทั้ง WebConfig และ CourseController
# ใช้ working directory ของแอปเป็น base (ทำงานทั้ง dev และ prod)
app.upload.base-dir=${user.dir}

# Contact form (disabled by default)
app.contact.mail-enabled=false
app.contact.recipient=support@localhost

# BUG FIX: spring-boot-starter-mail อยู่ใน pom.xml แต่ขาด config
# ตั้งค่า default ไว้ก่อนเพื่อไม่ให้ app crash ตอน start
# (ContactController มี @Autowired(required=false) แล้วจึงไม่ crash)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
